<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajitha Dental Care | Your Smile, Our Signature</title>
  <meta name="description" content="Ajitha Dental Care: exceptional dental care with a gentle touch and a commitment to confident, healthy smiles.">
  <style>
    html, body { min-height: 100%; margin: 0; background: #f8f3ea; }
    #root { min-height: 100vh; }
    #startup-splash {
      position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
      color: #e8c98a; background: radial-gradient(ellipse at center, #5b3820 0%, #382015 52%, #1d100b 100%);
      opacity: 1; visibility: visible; transition: opacity 240ms ease, visibility 0s linear 240ms;
    }
    #startup-splash.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
    #startup-splash > div { display: grid; justify-items: center; gap: 1.25rem; }
    #startup-splash .startup-ring {
      width: 76px; height: 76px; border: 2px solid rgba(232, 201, 138, .22);
      border-top-color: #e8c98a; border-radius: 50%; animation: startup-spin 1.1s linear infinite;
    }
    #startup-splash.has-error .startup-ring { animation: none; }
    #startup-splash p {
      margin: 0; font: 500 1rem/1.4 Georgia, serif; letter-spacing: .18em; text-align: center;
    }
    #startup-splash #startup-slow { max-width: 24rem; font: 400 .9rem/1.6 Arial, sans-serif; letter-spacing: normal; }
    #startup-slow a { color: #f2d28b; }
    @keyframes startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #startup-splash, #startup-splash.is-ready { transition: none; }
      #startup-splash .startup-ring { animation: none; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </noscript>
</head>
<body>
  <div id="startup-splash" role="status" aria-live="polite" aria-label="Loading Ajitha Dental Clinic website">
    <div>
      <span class="startup-ring" aria-hidden="true"></span>
      <p>AJITHA DENTAL CLINIC</p>
      <p id="startup-slow" hidden>The site is taking longer than expected. <a href="/">Reload the page</a></p>
    </div>
  </div>
  <script>
    setTimeout(() => {
      const splash = document.getElementById("startup-splash");
      const message = document.getElementById("startup-slow");
      if (splash && !splash.classList.contains("is-ready") && message) {
        splash.classList.add("has-error");
        message.hidden = false;
      }
    }, 8000);
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
